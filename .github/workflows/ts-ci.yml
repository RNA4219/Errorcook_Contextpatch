name: ts-ci
on:
  push:
  pull_request:

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-ci:
    name: ${{ matrix.pkg }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]
        pkg:  [contextpatch, errorcook]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install deps
        run: npm --prefix ${{ matrix.pkg }} install
      - name: Lint
        run: npm --prefix ${{ matrix.pkg }} run lint
      - name: Typecheck
        run: npm --prefix ${{ matrix.pkg }} run typecheck
      - name: Prepare artifact dir
        run: mkdir -p artifact/ci
      - name: Unit tests (capture log)
        run: npm --prefix ${{ matrix.pkg }} run test | tee artifact/ci/${{ matrix.pkg }}-vitest.log
      - name: Build
        run: npm --prefix ${{ matrix.pkg }} run build
      - name: Emit .ctxpack on failure
        if: failure()
        run: |
          mkdir -p work/.ctxpack
          cd contextpatch && npx tsx src/cli.ts detect   -p ../work/.ctxpack --from-artifact ../artifact/ci/
          cd contextpatch && npx tsx src/cli.ts triage   -p ../work/.ctxpack
          cd contextpatch && npx tsx src/cli.ts patch    -p ../work/.ctxpack
          cd contextpatch && npx tsx src/cli.ts validate -p ../work/.ctxpack
          cd errorcook && npx tsx src/cli.ts smell       -p ../work/.ctxpack
          cd errorcook && npx tsx src/cli.ts rank        -p ../work/.ctxpack
          cd errorcook && npx tsx src/cli.ts propose     -p ../work/.ctxpack
          cd errorcook && npx tsx src/cli.ts validate    -p ../work/.ctxpack
      - name: Upload .ctxpack artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctxpack-${{ matrix.pkg }}
          path: |
            work/.ctxpack/
            artifact/ci/
