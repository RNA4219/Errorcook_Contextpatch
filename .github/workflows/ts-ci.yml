name: ts-ci
on:
  push:
  pull_request:

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contextpatch:
    name: contextpatch on Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm --prefix contextpatch install
      - name: Lint
        run: npm --prefix contextpatch run lint
      - name: Typecheck
        run: npm --prefix contextpatch run typecheck
      - name: Prepare artifact dir
        run: mkdir -p artifact/ci
      - name: Unit tests (capture log)
        run: npm --prefix contextpatch run test | tee artifact/ci/contextpatch-vitest.log
      - name: Build
        run: npm --prefix contextpatch run build
      - name: Emit .ctxpack on failure
        if: failure()
        run: |
          set -e
          mkdir -p work/.ctxpack
          echo "Current directory: $(pwd)"
          echo "Repository structure:"
          ls -la
          # Process contextpatch commands
          npx --prefix contextpatch tsx src/cli.ts detect   -p work/.ctxpack --from-artifact artifact/ci/
          npx --prefix contextpatch tsx src/cli.ts triage   -p work/.ctxpack
          npx --prefix contextpatch tsx src/cli.ts patch    -p work/.ctxpack
          npx --prefix contextpatch tsx src/cli.ts validate -p work/.ctxpack
          # Process errorcook commands if available
          if [ -d "errorcook" ]; then
            echo "Processing errorcook commands..."
            npx --prefix errorcook tsx src/cli.ts smell       -p work/.ctxpack
            npx --prefix errorcook tsx src/cli.ts rank        -p work/.ctxpack
            npx --prefix errorcook tsx src/cli.ts propose     -p work/.ctxpack
            npx --prefix errorcook tsx src/cli.ts validate    -p work/.ctxpack
          else
            echo "errorcook directory not found, skipping errorcook commands"
          fi
          echo ".ctxpack generation completed successfully"
      - name: Upload .ctxpack artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctxpack-contextpatch
          path: |
            work/.ctxpack/
            artifact/ci/

  errorcook:
    name: errorcook on Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm --prefix errorcook install
      - name: Lint
        run: npm --prefix errorcook run lint
      - name: Typecheck
        run: npm --prefix errorcook run typecheck
      - name: Prepare artifact dir
        run: mkdir -p artifact/ci
      - name: Unit tests (capture log)
        run: npm --prefix errorcook run test | tee artifact/ci/errorcook-vitest.log
      - name: Build
        run: npm --prefix errorcook run build
      - name: Emit .ctxpack on failure
        if: failure()
        run: |
          set -e
          mkdir -p work/.ctxpack
          echo "Current directory: $(pwd)"
          echo "Repository structure:"
          ls -la
          # Process errorcook commands
          npx --prefix errorcook tsx src/cli.ts smell       -p work/.ctxpack
          npx --prefix errorcook tsx src/cli.ts rank        -p work/.ctxpack
          npx --prefix errorcook tsx src/cli.ts propose     -p work/.ctxpack
          npx --prefix errorcook tsx src/cli.ts validate    -p work/.ctxpack
          # Process contextpatch commands if available
          if [ -d "contextpatch" ]; then
            echo "Processing contextpatch commands..."
            npx --prefix contextpatch tsx src/cli.ts detect   -p work/.ctxpack --from-artifact artifact/ci/
            npx --prefix contextpatch tsx src/cli.ts triage   -p work/.ctxpack
            npx --prefix contextpatch tsx src/cli.ts patch    -p work/.ctxpack
            npx --prefix contextpatch tsx src/cli.ts validate -p work/.ctxpack
          else
            echo "contextpatch directory not found, skipping contextpatch commands"
          fi
          echo ".ctxpack generation completed successfully"
      - name: Upload .ctxpack artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctxpack-errorcook
          path: |
            work/.ctxpack/
            artifact/ci/
